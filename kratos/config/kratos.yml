version: v0.13.0

# All dynamic values (DSN, secrets, URLs) are injected via environment variables
# in docker-compose.yml using the KRATOS_* override format.

serve:
  public:
    # Overridden by KRATOS_SERVE_PUBLIC_BASE_URL env var
    base_url: http://localhost/identity/
    cors:
      enabled: true
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Session-Token
      exposed_headers:
        - Content-Type
      allow_credentials: true
  admin:
    base_url: http://0.0.0.0:4434/

selfservice:
  # Overridden by KRATOS_SELFSERVICE_DEFAULT_BROWSER_RETURN_URL env var
  default_browser_return_url: http://localhost/

  flows:
    login:
      ui_url: http://localhost/login
      lifespan: 10m
    registration:
      ui_url: http://localhost/register
      lifespan: 10m
      enabled: false
    settings:
      ui_url: http://localhost/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: false
      ui_url: http://localhost/recovery
    verification:
      enabled: false
      ui_url: http://localhost/verification

  methods:
    password:
      enabled: true
      config:
        min_password_length: 8
        identifier_similarity_check_enabled: true

identity:
  default_schema_id: fds-identity
  schemas:
    - id: fds-identity
      url: file:///etc/config/kratos/identity.schema.json

session:
  lifespan: 24h
  cookie:
    same_site: None

log:
  level: info
  format: json
  leak_sensitive_values: false

hashers:
  algorithm: argon2
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

ciphers:
  algorithm: xchacha20-poly1305
