# Local WSL testing overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Differences from prod:
#   - KC_HOSTNAME=localhost (set in .env)
#   - KC_HOSTNAME_STRICT=false (accepts requests on any hostname)
#   - ADMIN_ALLOWED_CIDR=0.0.0.0/0 (no IP restriction on /admin for local testing)

services:
  keycloak:
    environment:
      KC_HOSTNAME_STRICT: "false"

  nginx:
    environment:
      ADMIN_ALLOWED_CIDR: "0.0.0.0/0"
