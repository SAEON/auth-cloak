name: auth-cloak

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # PostgreSQL has no route to/from internet or Docker host

volumes:
  postgres_data:

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: auth-cloak-postgres
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_lock_waits=on
    security_opt:
      - no-new-privileges:true

  # ── Ory Kratos ───────────────────────────────────────────────────────────────
  kratos:
    image: oryd/kratos:v1.3
    container_name: auth-cloak-kratos
    restart: unless-stopped
    command: serve -c /etc/config/kratos/kratos.yml --dev=false
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER:        ${POSTGRES_USER}
      POSTGRES_DB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:          ${POSTGRES_DB}
      KRATOS_HOSTNAME:      ${KRATOS_HOSTNAME}
      FDS_HOSTNAME:         ${FDS_HOSTNAME}
      KRATOS_COOKIE_SECRET: ${KRATOS_COOKIE_SECRET}
      KRATOS_CIPHER_SECRET: ${KRATOS_CIPHER_SECRET}
    volumes:
      - ./kratos/config:/etc/config/kratos:ro
    expose:
      - "4433"   # Public API — nginx proxies this; never bound to host
    ports:
      # Admin API — bound to LAN IP so FDS API (Server 2) can reach it over LAN.
      # Never proxied through Nginx. Firewall restricts to FDS server LAN IP only.
      - "${KRATOS_ADMIN_BIND_IP}:4434:4434"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4433/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: auth-cloak-nginx
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      kratos:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SSL_CERT_DIR: ${SSL_CERT_DIR}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      # Mount full letsencrypt tree so symlinks in live/ resolve to archive/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
